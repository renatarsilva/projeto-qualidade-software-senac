spring.application.name=organizacao-recursos

# O esquema do banco é responsabilidade do Flyway (src/main/resources/db/migration).
# O Hibernate só confere se as entidades batem com as tabelas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Horários sempre em UTC no banco; a conversão de fuso acontece na borda (API e telas).
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Segredos vêm do ambiente, nunca do repositório (spec T-15, CA-13 e CA-16).
# A chave de assinatura do token não tem valor padrão: quem a lê falha se a variável não existir.
app.seguranca.chave-assinatura=${APP_JWT_CHAVE}
# Primeiro administrador: criado na subida só se o banco ainda não tiver nenhum (regra da T-15).
app.admin-inicial.email=${APP_ADMIN_EMAIL:}
app.admin-inicial.senha=${APP_ADMIN_SENHA:}

# A leitura do JSON não converte tipos: 30.5 não vira 30 e "30" (texto) não vira número (spec T-16, P-04).
spring.jackson.mapper.allow-coercion-of-scalars=false
spring.jackson.deserialization.accept-float-as-int=false

# Notificação externa (spec T-31, RF-11): URL, token e tempos limite só por configuração, nunca fixos no código.
# Sem url-base, a aplicação usa o modo simulado (só registra o aviso no log).
app.notificacao.url-base=${APP_NOTIFICACAO_URL:}
app.notificacao.token=${APP_NOTIFICACAO_TOKEN:}
app.notificacao.timeout-conexao=${APP_NOTIFICACAO_TIMEOUT_CONEXAO:500ms}
app.notificacao.timeout-leitura=${APP_NOTIFICACAO_TIMEOUT_LEITURA:1500ms}
