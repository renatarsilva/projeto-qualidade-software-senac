spring.application.name=organizacao-recursos

# O esquema do banco é responsabilidade do Flyway (src/main/resources/db/migration).
# O Hibernate só confere se as entidades batem com as tabelas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Horários sempre em UTC no banco; a conversão de fuso acontece na borda (API e telas).
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Segredos vêm do ambiente, nunca do repositório (spec T-15, CA-13 e CA-16).
# A chave de assinatura do token não tem valor padrão: quem a lê falha se a variável não existir.
app.seguranca.chave-assinatura=${APP_JWT_CHAVE}
# Primeiro administrador: criado na subida só se o banco ainda não tiver nenhum (regra da T-15).
app.admin-inicial.email=${APP_ADMIN_EMAIL:}
app.admin-inicial.senha=${APP_ADMIN_SENHA:}
