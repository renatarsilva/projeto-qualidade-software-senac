<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/base :: base(~{::title}, ~{::main})}">
<head><title>Salas</title></head>
<body>
<main class="container pb-4">
    <h1 class="h3 mb-3">Salas</h1>
    <form th:action="@{/admin/salas}" method="post" class="card card-body mb-4">
        <h2 class="h6">Cadastrar sala</h2>
        <div class="row g-3">
            <div class="col-6 col-md-3"><label class="form-label" for="nome">Nome (sala-NN)</label>
                <input class="form-control" id="nome" name="nome" th:value="${form['nome']}" required></div>
            <div class="col-6 col-md-3"><label class="form-label" for="tipoSala">Tipo</label>
                <input class="form-control" id="tipoSala" name="tipoSala" th:value="${form['tipoSala']}" required></div>
            <div class="col-6 col-md-2"><label class="form-label" for="capacidade">Capacidade</label>
                <input class="form-control" type="number" min="1" id="capacidade" name="capacidade"
                       th:value="${form['capacidade']}" required></div>
            <div class="col-6 col-md-3"><label class="form-label" for="localizacao">Localização</label>
                <input class="form-control" id="localizacao" name="localizacao" th:value="${form['localizacao']}" required></div>
            <div class="col-12 col-md-1 d-flex align-items-end"><div class="form-check">
                <input class="form-check-input" type="checkbox" id="restrito" name="restrito" value="true">
                <label class="form-check-label" for="restrito">Restrita</label></div></div>
        </div>
        <button class="btn btn-primary mt-3 align-self-start" type="submit">Cadastrar</button>
    </form>
    <div class="tabela-rolavel">
        <table class="table table-striped bg-white">
            <thead><tr><th>Nome</th><th>Tipo</th><th>Capacidade</th><th>Localização</th><th>Restrita</th></tr></thead>
            <tbody>
            <tr th:each="s : ${itens}">
                <td th:text="${s.nome}"></td><td th:text="${s.tipoSala}"></td><td th:text="${s.capacidade}"></td>
                <td th:text="${s.localizacao}"></td><td th:text="${s.restrito ? 'Sim' : 'Não'}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
