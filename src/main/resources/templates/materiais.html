<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/base :: base(~{::title}, ~{::main})}">
<head><title>Materiais</title></head>
<body>
<main class="container pb-4">
    <h1 class="h3 mb-3">Materiais</h1>
    <form th:action="@{/admin/materiais}" method="post" class="card card-body mb-4">
        <h2 class="h6">Cadastrar material</h2>
        <div class="row g-3">
            <div class="col-6 col-md-3"><label class="form-label" for="nome">Nome</label>
                <input class="form-control" id="nome" name="nome" th:value="${form['nome']}" required></div>
            <div class="col-6 col-md-3"><label class="form-label" for="tipoMaterial">Tipo</label>
                <input class="form-control" id="tipoMaterial" name="tipoMaterial" th:value="${form['tipoMaterial']}" required></div>
            <div class="col-6 col-md-3"><label class="form-label" for="patrimonio">Patrimônio</label>
                <input class="form-control" id="patrimonio" name="patrimonio" th:value="${form['patrimonio']}" required></div>
            <div class="col-6 col-md-3 d-flex align-items-end"><div class="form-check">
                <input class="form-check-input" type="checkbox" id="restrito" name="restrito" value="true">
                <label class="form-check-label" for="restrito">Restrito</label></div></div>
        </div>
        <button class="btn btn-primary mt-3 align-self-start" type="submit">Cadastrar</button>
    </form>
    <div class="tabela-rolavel">
        <table class="table table-striped bg-white">
            <thead><tr><th>Nome</th><th>Tipo</th><th>Patrimônio</th><th>Restrito</th></tr></thead>
            <tbody>
            <tr th:each="m : ${itens}">
                <td th:text="${m.nome()}"></td><td th:text="${m.tipoMaterial()}"></td>
                <td th:text="${m.patrimonio()}"></td><td th:text="${m.restrito() ? 'Sim' : 'Não'}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
