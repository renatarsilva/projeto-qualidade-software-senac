<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/base :: base(~{::title}, ~{::main})}">
<head><title>Fila de aprovação</title></head>
<body>
<main class="container pb-4">
    <h1 class="h3 mb-3">Fila de aprovação</h1>
    <p class="text-secondary" th:if="${#lists.isEmpty(reservas)}">Nenhuma reserva esperando aprovação.</p>
    <div class="tabela-rolavel" th:unless="${#lists.isEmpty(reservas)}">
        <table class="table table-striped align-middle bg-white">
            <thead><tr><th>#</th><th>Período</th><th>Recursos</th><th>Aprovar até</th><th></th></tr></thead>
            <tbody>
            <tr th:each="r : ${reservas}" th:id="'reserva-' + ${r.id()}">
                <td><a th:href="@{/reservas/{id}(id=${r.id()})}" th:text="${r.id()}">1</a></td>
                <td><span th:text="${@ap.data(r.inicio())}"></span> a <span th:text="${@ap.data(r.termino())}"></span></td>
                <td><span th:each="x, s : ${r.recursos()}"
                          th:text="${nomes[x.tipo() + ':' + x.id()]} + (${s.last} ? '' : ', ')"></span></td>
                <td th:text="${@ap.data(r.prazoAprovacaoEm())}"></td>
                <td class="text-nowrap">
                    <form class="linha" th:action="@{/reservas/{id}/aprovar(id=${r.id()})}" method="post">
                        <button class="btn btn-sm btn-success" type="submit">Aprovar</button></form>
                    <form class="linha" th:action="@{/reservas/{id}/rejeitar(id=${r.id()})}" method="post">
                        <button class="btn btn-sm btn-outline-danger" type="submit">Rejeitar</button></form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
