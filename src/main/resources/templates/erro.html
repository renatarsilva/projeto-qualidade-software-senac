    <title th:text="${titulo}">Algo deu errado</title>

        h1 { font-size: 1.6rem; }

            border-radius: .4rem; text-decoration: none; }

</head>
<body>
<main>
    <h1 th:text="${titulo}">Algo deu errado</h1>
    <p th:text="${mensagem}">Não foi possível concluir o que você pediu.</p>

</html>
