<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/base :: base(~{::title}, ~{::main})}">
<head><title>Professores</title></head>
<body>
<main class="container pb-4">
    <h1 class="h3 mb-3">Professores</h1>
    <form th:action="@{/admin/professores}" method="post" class="card card-body mb-4">
        <h2 class="h6">Cadastrar professor</h2>
        <div class="row g-3">
            <div class="col-12 col-md-5"><label class="form-label" for="nome">Nome (primeironome-ultimonome-matricula)</label>
                <input class="form-control" id="nome" name="nome" th:value="${form['nome']}" required></div>
            <div class="col-12 col-md-5"><label class="form-label" for="competencias">Competências (separadas por vírgula)</label>
                <input class="form-control" id="competencias" name="competencias" th:value="${form['competencias']}"></div>
            <div class="col-12 col-md-2 d-flex align-items-end"><div class="form-check">
                <input class="form-check-input" type="checkbox" id="restrito" name="restrito" value="true">
                <label class="form-check-label" for="restrito">Restrito</label></div></div>
        </div>
        <button class="btn btn-primary mt-3 align-self-start" type="submit">Cadastrar</button>
    </form>
    <div class="tabela-rolavel">
        <table class="table table-striped bg-white">
            <thead><tr><th>Nome</th><th>Matrícula</th><th>Competências</th><th>Restrito</th></tr></thead>
            <tbody>
            <tr th:each="p : ${itens}">
                <td th:text="${p.nome()}"></td><td th:text="${p.matricula()}"></td>
                <td th:text="${#strings.listJoin(p.competencias(), ', ')}"></td>
                <td th:text="${p.restrito() ? 'Sim' : 'Não'}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
