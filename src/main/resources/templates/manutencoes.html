<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/base :: base(~{::title}, ~{::main})}">
<head><title>Manutenção de recursos</title></head>
<body>
<main class="container pb-4">
    <h1 class="h3 mb-3">Manutenção de recursos</h1>
    <form th:action="@{/admin/manutencoes}" method="get" class="row g-3 mb-4">
        <div class="col-12 col-md-8">
            <label class="form-label" for="recurso">Recurso</label>
            <select class="form-select" id="recurso" name="recurso">
                <option value="">Escolha um recurso</option>
                <option th:each="r : ${recursos}" th:value="${r.id()}"
                        th:text="${@ap.tipo(r.tipo())} + ': ' + ${r.nome()}"
                        th:selected="${recursoEscolhido != null and recursoEscolhido == r.id()}"></option>
            </select>
        </div>
        <div class="col-12 col-md-4 d-flex align-items-end">
            <button class="btn btn-outline-primary w-100" type="submit">Ver períodos</button>
        </div>
    </form>
    <div class="alert alert-warning" role="alert" th:if="${not #lists.isEmpty(afetadas)}">
        Reservas afetadas pela manutenção:
        <span th:each="a, s : ${afetadas}">
            <a th:href="@{/reservas/{id}(id=${a})}" th:text="'reserva #' + ${a}"></a><span th:unless="${s.last}">, </span>
        </span>
    </div>
    <div th:if="${recursoEscolhido != null}">
        <h2 class="h5">Períodos registrados</h2>
        <p class="text-secondary" th:if="${#lists.isEmpty(periodos)}">Nenhum período de manutenção.</p>
        <div class="tabela-rolavel" th:unless="${#lists.isEmpty(periodos)}">
            <table class="table table-striped align-middle bg-white">
                <thead><tr><th>Início</th><th>Término</th><th>Motivo</th><th></th></tr></thead>
                <tbody>
                <tr th:each="p : ${periodos}">
                    <td th:text="${@ap.data(p.inicio())}"></td><td th:text="${@ap.data(p.termino())}"></td>
                    <td th:text="${p.motivo()}"></td>
                    <td>
                        <form th:action="@{/admin/manutencoes/{id}/encerrar(id=${p.id()})}" method="post">
                            <input type="hidden" name="recursoId" th:value="${recursoEscolhido}">
                            <button class="btn btn-sm btn-outline-danger" type="submit">Encerrar</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
    <form th:action="@{/admin/manutencoes}" method="post" class="card card-body mt-4">
        <h2 class="h6">Registrar manutenção</h2>
        <div class="row g-3">
            <div class="col-12 col-md-3"><label class="form-label" for="recursoId">Recurso</label>
                <select class="form-select" id="recursoId" name="recursoId">
                    <option value="">Escolha</option>
                    <option th:each="r : ${recursos}" th:value="${r.id()}" th:text="${r.nome()}"
                            th:selected="${recursoEscolhido != null and recursoEscolhido == r.id()}"></option>
                </select></div>
            <div class="col-6 col-md-3"><label class="form-label" for="inicio">Início</label>
                <input class="form-control" type="datetime-local" id="inicio" name="inicio" th:value="${inicio}" required></div>
            <div class="col-6 col-md-3"><label class="form-label" for="termino">Término</label>
                <input class="form-control" type="datetime-local" id="termino" name="termino" th:value="${termino}" required></div>
            <div class="col-12 col-md-3"><label class="form-label" for="motivo">Motivo</label>
                <input class="form-control" id="motivo" name="motivo" th:value="${motivo}" maxlength="100"></div>
        </div>
        <button class="btn btn-primary mt-3 align-self-start" type="submit">Registrar</button>
    </form>
</main>
</body>
</html>
