# Banco local para desenvolvimento.
# O ./mvnw spring-boot:run sobe este container sozinho (spring-boot-docker-compose).
# Os testes não usam este arquivo: eles sobem o próprio PostgreSQL com Testcontainers.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: recursos
      POSTGRES_USER: recursos
      POSTGRES_PASSWORD: recursos-local
    ports:
      - "5432"
